name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: description
    attributes: {label: Description, description: Redact private data.}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
  - type: textarea
    id: system
    attributes: {label: "sw_vers, model/chip, travel-mode --version, and travel-mode check output (redact private data)"}
  - type: checkboxes
    id: dry_run
    attributes:
      label: Dry-run
      options:
        - label: I reproduced this with --dry-run where possible
          required: false

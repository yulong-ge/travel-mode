name: TUI stress

on:
  push:
    paths:
      - "src/travel_mode/tui/**"
      - "tests/tui/**"
      - "tests/tui_interaction.py"
      - "scripts/stress_tui.py"
  pull_request:
    paths:
      - "src/travel_mode/tui/**"
      - "tests/tui/**"
      - "tests/tui_interaction.py"
      - "scripts/stress_tui.py"
  workflow_dispatch:

jobs:
  tui-stress:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.x"
      - run: uv sync --group dev --python 3.13
      - name: Run 30 finite suites with one job per CPU
        run: uv run python scripts/stress_tui.py --runs 30 --output "$RUNNER_TEMP/tui-stress"
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tui-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-stress/
          retention-days: 14
          if-no-files-found: error

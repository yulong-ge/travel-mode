name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build
        run: uv build
      - name: Check version matches tag
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - name: Check wheel and sdist contents
        run: uv run python scripts/check_dist.py
      - name: Extract release notes
        run: uv run python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz

  pypi:
    # Opt-in: set the repository variable PUBLISH_PYPI=true after configuring
    # the PyPI trusted publisher for this workflow and the `pypi` environment.
    needs: github-release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

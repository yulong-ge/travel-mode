name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.x"
      - run: uv sync --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.x"
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest -n auto --cov=travel_mode --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.x"
      - run: uv build
      - name: Check wheel and sdist contents
        run: uv run python scripts/check_dist.py
      - uses: actions/upload-artifact@v7
        with:
          name: travel-mode-wheel
          path: dist/*

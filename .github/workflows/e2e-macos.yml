name: macOS guarded e2e

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check_new_machine.py'
      - 'scripts/collect_macos_samples.py'
      - '.github/workflows/e2e-macos.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/e2e_*.py'
      - 'scripts/check_new_machine.py'
      - 'scripts/collect_macos_samples.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/e2e-macos.yml'

permissions:
  contents: read

jobs:
  clean-machine-readonly:
    name: clean-machine-readonly (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      TRAVEL_MODE_RUNNER_LABEL: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.8.x'
      - run: uv sync --group dev --python 3.13
      - name: Check, preview setup and suggest on a clean Mac
        run: uv run python scripts/check_new_machine.py --output "$RUNNER_TEMP/new-machine"
      - name: Collect raw macOS parser samples, including on acceptance failure
        if: always()
        run: uv run python scripts/collect_macos_samples.py --output "$RUNNER_TEMP/new-machine/raw-macos"
      - name: Keep read-only outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-machine-readonly-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/new-machine/
          retention-days: 14
          if-no-files-found: error
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.8.x'
      - id: setup
        run: |
          if ! command -v tmux >/dev/null; then
            brew install tmux
          fi
          uv sync --group dev --python 3.13
      - name: Guarded local round trip (AC mode)
        run: uv run python scripts/e2e_local.py
      - name: Guarded CLI and TUI round trips (AC mode)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run python scripts/e2e_ui.py
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/tui-e2e/**/*.json
            /tmp/tui-e2e/**/*.png
            /tmp/tui-e2e/**/*.txt
            /tmp/travel-mode-e2e-evidence/**

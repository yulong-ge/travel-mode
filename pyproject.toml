[project]
name = "travel-mode"
version = "1.1.0"
description = "One-command macOS battery-saving 'travel mode' with snapshot & restore (Textual TUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Long-louis" }]
keywords = ["macos", "battery", "pmset", "power", "tui", "textual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Power (UPS)",
  "Topic :: Utilities",
]
dependencies = ["textual>=8,<9", "tomlkit>=0.13,<1", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/yulong-ge/travel-mode"
Issues = "https://github.com/yulong-ge/travel-mode/issues"
Changelog = "https://github.com/yulong-ge/travel-mode/blob/main/CHANGELOG.md"

[project.scripts]
travel-mode = "travel_mode.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=6", "pre-commit>=4", "ruff>=0.6", "pillow>=10", "jsonschema>=4", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_mode"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/.pre-commit-config.yaml",
  "/.gitignore",
  "/src",
  "/tests",
  "/scripts",
  "/docs/json-schema",
  "/docs/sudoers.md",
  "/docs/releasing.md",
  "/examples",
  "/integrations",
  "/packaging",
  "/README.md",
  "/README.zh-CN.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "/tests/shots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not macos and not e2e"'
markers = [
  "e2e: manual local test that changes only guarded temporary fixtures and battery keys",
  "macos: test requires a macOS host and only reads system state",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Telemetry ticks convert any observation failure into a lint issue instead of
# killing the TUI under observation; the failure stays visible in lint.json.
"scripts/tui_debug.py" = ["BLE001"]

[tool.coverage.run]
source = ["src/travel_mode"]

[tool.coverage.report]
fail_under = 75

# Public product identities only. No machine-specific paths or labels.
# Matching is case-insensitive glob matching; app names are exact unless a glob is present.
# action applies to apps; matching non-Apple user LaunchAgents use unload unless action=notice.
# Backup tools match documented executables, never guessed user LaunchAgent labels.
# notice means identification only: no action, including explicit category selection.
version = 1


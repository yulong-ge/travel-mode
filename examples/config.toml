# travel-mode 配置模板
[apps]
policy = "adaptive"
setup_completed = false
default = "freeze"
watch = ["Google Chrome", "Slack"]
ignore = []
quit = []
freeze = []
skip = []
ask = []

[[apps.with_daemon]]
name = "Remote Support"
system_daemons = ["/Library/LaunchDaemons/example.daemon.plist"]
user_agents = ["/Library/LaunchAgents/example.agent.plist"]
group = "network"

[network]
apps = ["Tailscale"]

[services]
unload = []
keep = []

[power.battery]
# displaysleep = 3

[categories]
# Category actions supplement services.unload and apps actions; keep/skip take priority.
pause = ["sync", "backup", "updater"]
# Match a rule id or its public product name.
ignore = []

[options]
aggressive = false
language = "auto"
# Default interface: "tui" or "cli"; overridden by TRAVEL_MODE_INTERFACE, then --tui / --no-tui.
interface = "tui"
# Ask at startup, or choose work / away. --scenario and --profile skip the picker.
scenario = "ask"

[profiles.flight]
# Add profile-specific values in a future release.

[measurement]
# CLI blocks only with --measure. TUI comparisons consume existing telemetry refreshes.
automatic = false
seconds = 180
interval = 5
settle_seconds = 10
updates = 2

# Optional event agent is installed only by automation install.
[automation]
on_battery = "notify"
on_ac = "notify"
retain = 50

[apps.work]
freeze = []
quit = []
ask = []
skip = []

[apps.away]
freeze = []
quit = []
ask = []
skip = []
